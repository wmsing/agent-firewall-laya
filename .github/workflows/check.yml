name: check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps (fast tests; no Laya/torch)
        run: |
          python -m pip install -U pip
          pip install fastapi uvicorn pytest httpx pydantic

      - name: pytest (not slow)
        run: python -m pytest tests/ -m "not slow" -q
